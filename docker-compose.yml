services:
  api:
    build: .
    container_name: logsense-api
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-log_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-log_analyzer_db}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:16
    container_name: logsense-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-log_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-log_analyzer_db}
    volumes:
      - log_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-log_user} -d ${POSTGRES_DB:-log_analyzer_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  log_data:
