name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-checks:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: log_user
      POSTGRES_PASSWORD: ci-local-only-password
      POSTGRES_DB: log_analyzer_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start full Docker Compose stack
        run: docker compose up -d --build

      - name: Verify API and dashboard
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8002/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8002/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8002/dashboard >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8002/dashboard/assets/dashboard.js >/dev/null
          curl --fail --silent --show-error -X POST http://127.0.0.1:8002/logs/import >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8002/logs/dashboard-summary | python -c 'import json,sys; assert json.load(sys.stdin)["total_logs"] > 0'
          curl --fail --silent --show-error -X POST http://127.0.0.1:8002/logs/import | python -c 'import json,sys; assert json.load(sys.stdin)["imported_count"] == 0'

      - name: Docker logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services and clean CI volume
        if: always()
        run: docker compose down -v
